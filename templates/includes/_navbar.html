<nav class="bg-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between">
            <!-- Logo -->
            <div class="flex items-center py-4">
                <a href="{% url 'home' %}" class="text-2xl font-bold text-indigo-600">FeedMe</a>
            </div>
            
            <!-- Auth Links -->
            <div class="flex items-center space-x-4">

                    <a href="{% url 'account_logout' %}" class="px-3 py-2 text-gray-700 hover:text-indigo-600">Logout</a>
                    <a href="{% url 'profile' %}" class="px-3 py-2 text-gray-700 hover:text-indigo-600">Profile</a>
                {% else %}
                    <a href="{% url 'account_login' %}" class="px-3 py-2 text-gray-700 hover:text-indigo-600">Login</a>
                    <a href="{% url 'account_signup' %}" class="px-3 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Sign Up</a>

            </div>
        </div>
