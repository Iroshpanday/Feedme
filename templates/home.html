<!-- templates/home.html -->
{% extends 'base.html' %}

{% block title %}Home - FeedMe{% endblock %}

{% block content %}
<div class="text-center py-12">
    <h1 class="text-4xl font-bold text-gray-800">Welcome to FeedMe</h1>
    {% if user.is_authenticated %}
        <p class="mt-4">Hello, {{ user.email }}!</p>
    {% endif %}
</div>
{% endblock %}
